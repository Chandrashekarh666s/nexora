<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXORA · Coding Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#030406;--bg2:#101318;--surface:#151A21;--elev:#1B212A;--tx:#F2F3F5;--tx2:#A0A6B0;--tx3:#737B87;--bd:#292F38;--cy:#79C9E6;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:10px;font:600 18px 'Space Grotesk',sans-serif;letter-spacing:.14em;color:var(--tx);text-decoration:none}
.btn{height:42px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(10,13,18,.5);backdrop-filter:blur(10px);color:var(--tx);font:500 14px Inter,sans-serif;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.p{background:#fff;color:#0b0d10;border-color:#fff;box-shadow:0 0 34px rgba(121,201,230,.3)}
.btn.p:hover{transform:translateY(-1px);background:#fff}
.btn.big{height:48px;padding:0 30px;font-size:15px}
dialog{background:var(--surface);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(420px,calc(100vw - 32px));max-height:calc(100svh - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--bd);border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--tx2);padding:6px 14px;border-radius:999px;font:500 13px Inter,sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--elev);color:var(--tx)}
.x{border:0;background:transparent;color:var(--tx2);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px}
dialog h2{font:600 22px 'Space Grotesk',sans-serif;margin:0 0 12px}
dialog form{display:grid;gap:12px}
[hidden]{display:none!important}
dialog label{display:grid;gap:5px;color:var(--tx2);font-size:13px}
dialog input,dialog select{width:100%;height:42px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);color:var(--tx);font:400 14px Inter,sans-serif}
dialog input:focus,dialog select:focus{border-color:var(--cy);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eye{position:absolute;right:6px;top:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:var(--elev);color:var(--tx2);font:500 12px Inter,sans-serif;cursor:pointer}
dialog label.chk{display:flex;align-items:center;gap:8px;color:var(--tx2)}dialog label.chk input{width:auto;height:auto}
.err{min-height:18px;margin:0;color:#D87979;font-size:13px}
.lnk{border:0;background:transparent;color:var(--tx3);font:400 13px Inter,sans-serif;cursor:pointer;text-decoration:underline}
dialog .btn[disabled]{opacity:.6;cursor:wait}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:12px 20px;border:1px solid var(--bd);border-radius:12px;background:var(--elev);color:var(--tx);font-size:14px;transition:.3s;z-index:40;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ab p{color:var(--tx2);margin:0 0 10px}
html,body{height:100%}body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:1px solid var(--bd)}.top a{color:var(--tx2);text-decoration:none;font-size:14px}
.split{flex:1;display:grid;grid-template-columns:minmax(300px,42%) 1fr;min-height:0}@media(max-width:860px){.split{grid-template-columns:1fr;grid-template-rows:auto 70vh}}
.pp{overflow:auto;padding:20px 22px;border-right:1px solid var(--bd)}.pp h1{margin:0 0 6px;font:500 24px 'Space Grotesk',sans-serif}.pp h4{margin:18px 0 6px;font:600 13px 'Space Grotesk';letter-spacing:.05em;text-transform:uppercase;color:var(--tx3)}
.pp pre{margin:0;padding:10px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}.pp p{white-space:pre-wrap;color:var(--tx2)}
.ed{display:flex;flex-direction:column;min-width:0;min-height:0}.tb{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tb select{height:34px;padding:0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);color:var(--tx)}.sm{height:34px;padding:0 16px;font-size:13px}
#mon{flex:1;min-height:240px}#mon textarea{width:100%;height:100%;background:var(--bg2);color:var(--tx);border:0;padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:none}
#res{max-height:36%;overflow:auto;border-top:1px solid var(--bd);padding:12px 16px;font-size:14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}pre.o{margin:0;white-space:pre-wrap;font:12px ui-monospace,monospace}
.ok{color:#6fd39b}.bad{color:#e57b7b}.warn{color:#e9b95c}.mut{color:var(--tx3)}.EASY{color:#6fd39b}.MEDIUM{color:#e9b95c}.HARD{color:#e57b7b}.ban{margin:0 0 12px;padding:10px 12px;border:1px solid rgba(233,185,92,.5);border-radius:10px;color:#e9b95c;font-size:13px}
</style></head><body>
<header class="top"><a href="/dashboard.html#practice">← Practice</a><b style="font-family:'Space Grotesk'">NEXORA Coding Arena</b><span id="who" class="mut" style="margin-left:auto;font-size:13px"></span></header>
<div class="split"><section class="pp" id="pp">Loading…</section>
<section class="ed"><div class="tb"><select id="lang"><option value="python">Python</option><option value="cpp">C++</option><option value="c">C</option><option value="java">Java</option><option value="javascript">JavaScript</option></select>
<button class="btn sm" id="reset">Reset</button><button class="btn sm" id="cust">Custom input</button><span style="flex:1"></span><button class="btn sm" id="run">Run samples</button><button class="btn p sm" id="sub">Submit</button></div>
<div id="mon"></div><div id="res"><span class="mut">Run executes the public samples and awards nothing. Submit grades every test, hidden ones included, and is recorded.</span></div></section></div>
<div id="toast" role="status"></div>
<script src="/js/arena.js"></script>
</body></html>
