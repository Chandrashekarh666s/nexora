<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXORA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#030406;--bg2:#101318;--surface:#151A21;--elev:#1B212A;--tx:#F2F3F5;--tx2:#A0A6B0;--tx3:#737B87;--bd:#292F38;--cy:#79C9E6;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:10px;font:600 18px 'Space Grotesk',sans-serif;letter-spacing:.14em;color:var(--tx);text-decoration:none}
.btn{height:42px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(10,13,18,.5);backdrop-filter:blur(10px);color:var(--tx);font:500 14px Inter,sans-serif;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.p{background:#fff;color:#0b0d10;border-color:#fff;box-shadow:0 0 34px rgba(121,201,230,.3)}
.btn.p:hover{transform:translateY(-1px);background:#fff}
.btn.big{height:48px;padding:0 30px;font-size:15px}
dialog{background:var(--surface);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(420px,calc(100vw - 32px));max-height:calc(100svh - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--bd);border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--tx2);padding:6px 14px;border-radius:999px;font:500 13px Inter,sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--elev);color:var(--tx)}
.x{border:0;background:transparent;color:var(--tx2);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px}
dialog h2{font:600 22px 'Space Grotesk',sans-serif;margin:0 0 12px}
dialog form{display:grid;gap:12px}
[hidden]{display:none!important}
dialog label{display:grid;gap:5px;color:var(--tx2);font-size:13px}
dialog input,dialog select{width:100%;height:42px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);color:var(--tx);font:400 14px Inter,sans-serif}
dialog input:focus,dialog select:focus{border-color:var(--cy);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eye{position:absolute;right:6px;top:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:var(--elev);color:var(--tx2);font:500 12px Inter,sans-serif;cursor:pointer}
dialog label.chk{display:flex;align-items:center;gap:8px;color:var(--tx2)}dialog label.chk input{width:auto;height:auto}
.err{min-height:18px;margin:0;color:#D87979;font-size:13px}
.lnk{border:0;background:transparent;color:var(--tx3);font:400 13px Inter,sans-serif;cursor:pointer;text-decoration:underline}
dialog .btn[disabled]{opacity:.6;cursor:wait}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:12px 20px;border:1px solid var(--bd);border-radius:12px;background:var(--elev);color:var(--tx);font-size:14px;transition:.3s;z-index:40;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ab p{color:var(--tx2);margin:0 0 10px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(14px,3vw,40px) 12px;border-bottom:1px solid var(--bd);background:rgba(3,4,6,.82);backdrop-filter:blur(12px)}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}.nav a{padding:7px 14px;border-radius:999px;color:var(--tx2);text-decoration:none;font-size:14px}.nav a:hover{color:var(--tx)}.nav a.on{background:var(--elev);color:var(--tx);border:1px solid var(--bd)}
.who{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:13px}.badge{padding:4px 11px;border:1px solid var(--bd);border-radius:999px;background:var(--elev);color:var(--cy);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:28px clamp(14px,3vw,32px) 80px}
h1.t{margin:0 0 4px;font:500 clamp(24px,3.6vw,34px)/1.15 'Space Grotesk',sans-serif;letter-spacing:-.02em}.lead{margin:0 0 22px;color:var(--tx2)}
.grid{display:grid;gap:14px;margin-bottom:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{padding:18px 20px;border:1px solid var(--bd);border-radius:16px;background:var(--surface);min-width:0}.card h3{margin:0 0 12px;font:600 15px 'Space Grotesk',sans-serif}
.stat b{display:block;font:500 28px 'Space Grotesk',sans-serif}.stat span{color:var(--tx2);font-size:13px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--bd)}th{color:var(--tx3);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase}tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:rgba(255,255,255,.03)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 12px}.bar .r{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{height:38px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);color:var(--tx);font:400 14px Inter,sans-serif}textarea{height:auto;padding:10px 12px;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.sm{height:32px;padding:0 14px;font-size:13px}.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--bd);background:var(--elev)}
.ok{color:#6fd39b}.bad{color:#e57b7b}.warn{color:#e9b95c}.mut{color:var(--tx3)}.EASY{color:#6fd39b}.MEDIUM{color:#e9b95c}.HARD{color:#e57b7b}
.pb{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#d99a1a,#ffd45e);transition:width 1s}
.crownbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.pil{flex:1;min-width:190px;display:grid;gap:10px;font-size:13px}.pil div span{display:flex;justify-content:space-between;color:var(--tx2);margin-bottom:3px}
.hm{display:block;max-width:100%}.hm rect{rx:2}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{height:30px;padding:0 12px;font-size:13px}.chips button.on{background:var(--elev);border-color:var(--cy)}
.cols{display:flex;align-items:flex-end;gap:5px;height:90px}.cols div{flex:1;background:linear-gradient(#ffd45e,#b9740a);border-radius:4px 4px 0 0;min-height:2px;position:relative}.cols small{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--tx2)}
.lb{display:grid;grid-template-columns:34px 54px 1fr auto auto;gap:14px;align-items:center;padding:10px 16px;border:1px solid var(--bd);border-radius:14px;background:var(--surface);margin-bottom:8px}.lb.me{border-color:var(--cy)}.lb.m{border-color:rgba(244,174,30,.55);box-shadow:0 0 26px rgba(244,174,30,.12)}
.pts{font:600 18px 'Space Grotesk',sans-serif;text-align:right}.hs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.hs div{padding:12px;border:1px solid var(--bd);border-radius:12px;text-align:center}.hs b{display:block;font:500 22px 'Space Grotesk'}
dialog.wide{width:min(980px,calc(100vw - 24px))}dialog form label{display:grid;gap:5px;margin-bottom:10px;font-size:13px;color:var(--tx2)}pre.code{margin:0;padding:14px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:50vh}
.note{color:var(--tx3);font-size:12px}.empty{padding:22px;color:var(--tx3)}.err{color:#e57b7b;font-size:13px;min-height:18px;margin:4px 0}
@media(max-width:640px){.lb{grid-template-columns:26px 46px 1fr auto}.lb .hh{display:none}.top{gap:8px}}
</style></head><body>
<header class="top"><a class="brand" href="/"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4l16 16V4"/></svg>NEXORA</a>
<nav class="nav" id="nav"></nav><div class="who"><span class="badge" id="badge"></span><span id="nm"></span><button class="btn sm" id="out">Logout</button></div></header>
<main id="view"><div class="empty">Loading…</div></main>
<dialog id="dlg" class="wide"><div class="dh"><h2 id="dt" style="margin:0"></h2><button type="button" class="x" id="dx" aria-label="Close">×</button></div><div id="db"></div></dialog>
<div id="toast" role="status"></div>
<script src="/js/crown-core.js"></script><script src="/js/crown.js"></script><script src="/js/app.js"></script>
</body></html>
